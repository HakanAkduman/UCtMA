services:
  docling_converter_service:
    build: . #burada image dosyasının DockerFile ın yolunu belirtiyoruz
    container_name: docling_converter_service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/uploads
      - docling_models:/app/models_cache
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/models_cache
      - XDG_CACHE_HOME=/app/models_cache
      - RABBITMQ_HEARTBEAT_SECONDS=${RABBITMQ_HEARTBEAT_SECONDS:-600}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_QUEUE_FILE=${RABBITMQ_QUEUE_FILE}
      - RABBITMQ_EXCHANGE_FILE=${RABBITMQ_EXCHANGE_FILE}
      - RABBITMQ_ROUTING_KEY_FILE=${RABBITMQ_ROUTING_KEY_FILE}
      - BACKEND_CALLBACK_URL=${BACKEND_CALLBACK_URL}
      - CALLBACK_SHARED_SECRET=${CALLBACK_SHARED_SECRET}

volumes:
  docling_models:
    external: true
    name: docling_converter_service_docling_models
  uploads:
    name: uctma_uploads

networks:
  default:
    external: true
    name: uctma_default
