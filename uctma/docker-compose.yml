

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: rag-platform-postgres
    ports:
      - "${DB_HOST_PORT}:${DB_CONTAINER_PORT}"
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: uctma_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_MGMT_PORT}:${RABBITMQ_MGMT_PORT}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit heartbeat 600"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  backend-service:
    build: .
    container_name: rag-platform-backend
    ports:
      - "8080:8080"
    volumes:
      - uploads:/uploads
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:${DB_CONTAINER_PORT}/${DB_NAME}
      - DB_HOST_PORT=${DB_HOST_PORT}
      - DB_CONTAINER_PORT=${DB_CONTAINER_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - UPLOAD_PATH=${UPLOAD_PATH}
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - RABBITMQ_QUEUE_FILE=${RABBITMQ_QUEUE_FILE}
      - RABBITMQ_EXCHANGE_FILE=${RABBITMQ_EXCHANGE_FILE}
      - RABBITMQ_ROUTING_KEY_FILE=${RABBITMQ_ROUTING_KEY_FILE}
    depends_on:
      postgres-db:
        condition: service_healthy

  # One-shot model prefetch service: use this to populate the persistent models volume
  # Run with: docker compose run --rm model-prefetch
  model-prefetch:
    build:
      context: ../docling_converter_service
      dockerfile: Dockerfile
    image: uctma_docling_prefetch:latest
    command:
      - sh
      - -c
      - >-
        docling-tools models download -o /app/models_cache
        && docling-tools models download rapidocr --rapidocr-backend-lang torch:ch -o /app/models_cache
        && docling-tools models download whisper_base -o /app/models_cache/whisper
    environment:
      - HF_HOME=/app/models_cache
      - XDG_CACHE_HOME=/app/models_cache
    volumes:
      - docling_models:/app/models_cache
    restart: 'no'

volumes:
  pgdata:
  rabbitmq_data:
  uploads:
    name: uctma_uploads
  docling_models:
    external: true
    name: docling_converter_service_docling_models

networks:
  default:
    name: uctma_default
