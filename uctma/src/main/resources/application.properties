# Server Yapılandırması
server.port=8080


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Yapılandırması
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Konsol Log Ayarları 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Değişkenleri (.env dosyasından okunur)
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION}


#Mail için gerekli olan variablelar
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

#yüklenen dosyaların tutulacağı path
file.upload-dir=${UPLOAD_PATH}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#rabbitmq için gerekli ayarlamalar
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Custom RabbitMQ Queue, Exchange and Routing Key
rabbitmq.queue.file-processing=${RABBITMQ_QUEUE_FILE}
rabbitmq.exchange.file-processing=${RABBITMQ_EXCHANGE_FILE}
rabbitmq.routing-key.file-processing=${RABBITMQ_ROUTING_KEY_FILE}

