services:
  frontend:
    build:
      context: .
      args:
        FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    container_name: uctma_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      BACKEND_URL: ${BACKEND_URL}
      PORT: ${FRONTEND_PORT:-3000}
    networks:
      - uctma_default

networks:
  uctma_default:
    external: true
